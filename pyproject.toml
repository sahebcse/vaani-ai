[project]
name = "vaani"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/unit", "tests/contract"]
addopts = "--cov=vaani --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
omit = ["vaani/main.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
unfixable = ["B008"]

[tool.ruff.lint.per-file-ignores]
"vaani/admin.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
